name: VeriRx
options:
  bundleIdPrefix: com.verirx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VeriRx:
    type: application
    platform: iOS
    bundleId: com.verirx.app
    sources:
      - path: VeriRx
        excludes:
          - "Resources/**"
      - path: VeriRx/Resources/verirx_pack.sqlite
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: StoreKit.framework
    info:
      path: VeriRx/Info.plist
      properties:
        CFBundleDisplayName: VeriRx
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      storeKitConfiguration: VeriRx/Resources/VeriRx.storekit
